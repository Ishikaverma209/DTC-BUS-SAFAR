kind = "web"
previewPath = "/"
title = "DTC Bus Booking"
version = "1.0.0"
id = "artifacts/dtc-bus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19842

[services.development]
run = "pnpm --filter @workspace/dtc-bus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dtc-bus", "run", "build" ]
publicDir = "artifacts/dtc-bus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19842"
BASE_PATH = "/"
